<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div style="border-style: solid; padding:20px; display: flex; flex-direction: column; width: 600px; height:600px">
        <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 50px;">
            <img src="./assets/busImage.jpg" width="100px">
            <h1>Bus Booking System</h1>
        </div>

        <form>
            <div class="form-details" style="display: flex; flex-direction: column;">
                <div class="user-information"
                    style="display: flex; align-items: center; justify-content: center; border-style: solid; margin: 0; padding: 0; height: 30px;">
                    <h1 style="padding: 0;">User Information</h1>
                </div>
                <div style="margin-top: 20px">
                    <label for="user-name">User Name: </label>
                    <input type="text" name="user-name">
                </div>

                <div>
                    <label for="user-age">User Age: </label>
                    <input type="text" name="user-age">
                </div>

                <div>
                    <label for="user-adhaar">User Adhaar no. : </label>
                    <input type="text" name="user-adhaar">
                </div>

                <div>
                    <label for="city">Select your city:</label>
                    <select name="city">
                        <option>
                            Uttar Pradesh
                        </option>
                        <option>
                            Delhi
                        </option>
                        <option>
                            Assam
                        </option>
                        <option>
                            Maharashtra
                        </option>
                        <option>
                            Uttrakhand
                        </option>
                    </select>
                </div>

                <div>
                    <label for="date">Date: </label>
                    <input type="date">
                </div>

                <div class="bus-information"
                    style="display: flex; align-items: center; justify-content: center; border-style: solid; margin-top: 50px; padding: 0; height: 30px;">
                    <h1>Bus Information</h1>
                </div>
                <div style="margin-top: 20px;">
                    <label for="bus-option">AC Bus 2000</label>
                    <input type="radio" value="2000" name="bus-option">
                </div>

                <div>
                    <label for="bus-option">Non ac bus 1500</label>
                    <input type="radio" value="1500" name="bus-option">
                </div>

                <div>
                    <label for="seat-num">Seat Number: </label>
                    <select name="seat-num">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                    </select>
                </div>
            </div>

            <center>
                <input type="submit" style="margin-top: 80px; padding:20px">
            </center>
        </form>

    </div>
    <script>
        function handleSubmit(event) {
            // Prevent the page from refreshing on form submission
            event.preventDefault(); 
            
            // Capture the form data
            const formElement = event.target;
            const formData = new FormData(formElement);
            
            // Convert to a plain JavaScript object for easy logging/usage
            const formValues = Object.fromEntries(formData.entries());
            
            console.log("Form Submitted Successfully!");
            console.log(formValues);
        }
    </script>
</body>

</html>
