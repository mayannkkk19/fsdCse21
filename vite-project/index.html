<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-project</title>
    <style>
      .items-grid {
        display: grid;
        grid-template-columns: 428px 428px 428px 428px;
        gap: 14px;
      }
      .item-card {
        border-style: solid;
        padding: 14px;
        border-width: 4px;
        width: 400px;
      }
      .item-card-heading {
        padding: 10px;
        background-color: lightpink;
      }
      .item-card-image {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .item-card-title {
        padding: 10px;
        background-color: lightgreen;
      }
      .item-card-price {
        padding: 10px;
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
